<html>
<head>
    <title>Personal Profile</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">
        <h1>Personal Profile</h1>
        <p>Fill in your personal information below.</p>

        <form action="profileServlet" method="post">

            <label>Name:</label>
            <input type="text" name="name" required>

            <label>Student ID:</label>
            <input type="text" name="studentId" required>

            <label>Programme:</label>
            <input type="text" name="programme" required>

            <label>Email:</label>
            <input type="email" name="email" required>

            <label>Hobbies:</label>
            <input type="text" name="hobbies" required>

            <label>Short Self-Introduction:</label>
            <textarea name="introduction" rows="4" required></textarea>

            <button type="submit">Submit Profile</button>

        </form>
    </div>

</body>
</html>
